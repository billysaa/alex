services:
  - type: web
    name: zagkas-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GROQ_API_KEY
        sync: false
      - key: FAST_MODEL
        value: openai/gpt-oss-20b
      - key: DEEP_MODEL
        value: openai/gpt-oss-120b
